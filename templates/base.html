<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 1080px;
    height: 1920px;
    background-color: #0c0d12;
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Grid Subtle Background */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    padding: 100px 70px 140px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header Tier */
  .header-tag {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .badge {
    background: #181a22;
    border: 1px solid #282b38;
    color: #ff6b00;
    font-size: 24px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 100px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .tag-meta {
    color: #63687d;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .headline {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -1.5px;
    color: #ffffff;
  }
  .highlight-orange { color: #ff6b00; }
  .highlight-blue { color: #0088ff; }
  .highlight-green { color: #25d366; }
  .highlight-red { color: #ff453a; }

  /* Main Canvas Area */
  .canvas {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: 40px 0;
    position: relative;
  }

  /* UI Card Elements */
  .card {
    background: #14161f;
    border: 2px solid #242838;
    border-radius: 28px;
    padding: 44px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .card-label {
    font-size: 22px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #717791;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-value {
    font-size: 44px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  /* Footer Navigation Pills ala BenerGak */
  .footer-nav {
    display: flex;
    gap: 20px;
    margin-top: 30px;
  }
  .nav-pill {
    flex: 1;
    padding: 20px 0;
    text-align: center;
    background: #14161f;
    border: 2px solid #242838;
    border-radius: 100px;
    font-size: 22px;
    font-weight: 700;
    color: #63687d;
    transition: all 0.3s ease;
  }
  .nav-pill.active {
    background: #ff6b00;
    border-color: #ff6b00;
    color: #000000;
    box-shadow: 0 0 30px rgba(255, 107, 0, 0.4);
  }

  .channel-footer {
    text-align: center;
    margin-top: 30px;
    color: #4b5066;
    font-size: 22px;
    font-weight: 600;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 25px rgba(255,107,0,0.25); }
    50% { box-shadow: 0 0 55px rgba(255,107,0,0.6); }
  }
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(1000%); }
  }
  @keyframes stampSlam {
    0% { transform: scale(2.2) rotate(-8deg); opacity: 0; }
    60% { transform: scale(0.95) rotate(-3deg); opacity: 1; }
    80% { transform: scale(1.05) rotate(-2deg); }
    100% { transform: scale(1) rotate(-3deg); opacity: 1; }
  }
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    70% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes dataFlow {
    0% { stroke-dashoffset: 100; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes glitchAlert {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px, -2px); }
    60% { transform: translate(-2px, -1px); }
    80% { transform: translate(2px, 2px); }
  }
  
  .slam-in {
    animation: stampSlam 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .pop-in {
    animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .glow-active {
    animation: pulseGlow 1.8s infinite ease-in-out;
  }
  .glitch-box {
    animation: glitchAlert 0.35s infinite ease-in-out;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container" id="app"></div>
</body>
</html>
