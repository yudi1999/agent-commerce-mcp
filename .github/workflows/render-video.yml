name: Render Authentic Demo Video

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/render-video.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python Dependencies & Playwright
        run: |
          pip install Pillow playwright
          playwright install --with-deps chromium

      - name: Render Video & Compile Motion Audio
        run: |
          python scripts/render_browser_video.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-browser-masterpiece-video
          path: scripts/output/mcp-browser-masterpiece.mp4
          retention-days: 7
